services:
  - type: web
    runtime: static
    name: bill-splitter-web
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter bill-splitter-web build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
